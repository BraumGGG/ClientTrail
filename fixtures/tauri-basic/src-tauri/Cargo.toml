[package]
name = "client-test-fixture"
version = "0.1.0"
description = "Minimal Tauri fixture for client-test"
authors = ["client-test"]
edition = "2021"

[lib]
name = "client_test_fixture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
client-test = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
